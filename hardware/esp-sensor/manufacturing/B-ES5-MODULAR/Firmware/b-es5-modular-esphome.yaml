substitutions:
  device_name: xerolux-b-es5-modular
  friendly_name: Xerolux Modular Air

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: xerolux.b-es5-modular
    version: "2026.08-es"

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Xerolux Modular Setup"
captive_portal:

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true
  frequency: 100kHz

one_wire:
  - platform: gpio
    pin: GPIO23
    id: field_onewire

uart:
  id: rs485_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  stop_bits: 1
modbus:
  id: field_modbus
  uart_id: rs485_uart
  flow_control_pin: GPIO2

sensor:
  - platform: sht4x
    address: 0x44
    precision: High
    heater_max_duty: 0.0
    update_interval: 10s
    temperature:
      name: "Room Temperature"
      id: room_temperature
    humidity:
      name: "Room Humidity"
      id: room_humidity

  # Optional AIR-PRESSURE module. Remove this block if it is not fitted.
  - platform: bmp3xx_i2c
    address: 0x76
    update_interval: 30s
    pressure:
      name: "Air Pressure"
      id: air_pressure
    temperature:
      name: "Pressure Sensor Temperature"
      disabled_by_default: true

  # Optional AIR-CO2 module. Remove this block if it is not fitted.
  - platform: scd4x
    address: 0x62
    measurement_mode: periodic
    update_interval: 30s
    automatic_self_calibration: true
    co2:
      name: "CO2"
    temperature:
      name: "CO2 Sensor Temperature"
      disabled_by_default: true
    humidity:
      name: "CO2 Sensor Humidity"
      disabled_by_default: true

  # Optional AIR-VOCNOX module. Remove this block if it is not fitted.
  - platform: sgp4x
    update_interval: 10s
    store_baseline: true
    voc:
      name: "VOC Index"
    nox:
      name: "NOx Index"
    compensation:
      temperature_source: room_temperature
      humidity_source: room_humidity

  - platform: adc
    pin: GPIO0
    name: "0-10 V Input Raw"
    attenuation: 12db
    update_interval: 2s
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 0.0 -> 0.0
            - 2.326 -> 10.0
    unit_of_measurement: V

binary_sensor:
  - platform: gpio
    name: "Dry Contact 1"
    pin: {number: GPIO18, inverted: true}
  - platform: gpio
    name: "Dry Contact 2"
    pin: {number: GPIO19, inverted: true}
  - platform: gpio
    name: "Service Button"
    pin: {number: GPIO20, inverted: true}

# DS18B20 addresses are added after discovery in the log. Calibrate the
# MCP4725/0-10 V output on the physical first article before enabling control.

