substitutions:
  device_name: xerolux-b-es4-air-r2
  friendly_name: Xerolux Ultimate Air R2

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: xerolux.b-es4-air-r2
    version: "2026.08-r2"

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Xerolux Air R2 Setup"
captive_portal:

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true
  frequency: 100kHz

one_wire:
  - platform: gpio
    pin: GPIO23
    id: field_onewire

uart:
  id: rs485_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  stop_bits: 1

modbus:
  id: field_modbus
  uart_id: rs485_uart
  flow_control_pin: GPIO2

sensor:
  - platform: sht4x
    address: 0x44
    precision: High
    heater_max_duty: 0.0
    update_interval: 10s
    temperature:
      name: Room Temperature
      id: room_temperature
    humidity:
      name: Room Humidity
      id: room_humidity

  - platform: bmp3xx_i2c
    address: 0x76
    update_interval: 30s
    iir_filter: 4x
    temperature:
      name: Pressure Sensor Temperature
      disabled_by_default: true
    pressure:
      name: Air Pressure
      id: air_pressure

  - platform: scd4x
    id: scd41_sensor
    address: 0x62
    measurement_mode: periodic
    update_interval: 30s
    ambient_pressure_compensation_source: air_pressure
    automatic_self_calibration: true
    co2:
      name: CO2
      id: room_co2
    temperature:
      name: CO2 Sensor Temperature
      disabled_by_default: true
    humidity:
      name: CO2 Sensor Humidity
      disabled_by_default: true

  - platform: sgp4x
    update_interval: 10s
    store_baseline: true
    voc:
      name: VOC Index
      id: room_voc_index
    nox:
      name: NOx Index
      id: room_nox_index
    compensation:
      temperature_source: room_temperature
      humidity_source: room_humidity

  - platform: adc
    pin: GPIO0
    name: 0-10 V Input Raw
    id: analog_input_raw
    attenuation: 12db
    update_interval: 2s
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 0.0 -> 0.0
            - 2.326 -> 10.0
    unit_of_measurement: V
    accuracy_decimals: 2

binary_sensor:
  - platform: gpio
    name: Dry Contact 1
    pin:
      number: GPIO18
      inverted: true
  - platform: gpio
    name: Dry Contact 2
    pin:
      number: GPIO19
      inverted: true
  - platform: gpio
    name: Service Button
    pin:
      number: GPIO20
      inverted: true

output:
  - platform: gpio
    id: status_led_output
    pin: GPIO10
  - platform: gpio
    id: bus_led_output
    pin: GPIO22
  - platform: gpio
    id: vin_led_output
    pin: GPIO21
  - platform: gpio
    id: relay_output
    pin: GPIO3

light:
  - platform: binary
    name: Status LED
    id: status_led
    output: status_led_output
    restore_mode: ALWAYS_OFF
  - platform: binary
    name: Bus LED
    id: bus_led
    output: bus_led_output
    restore_mode: ALWAYS_OFF
  - platform: binary
    name: VIN LED
    id: vin_led
    output: vin_led_output
    restore_mode: ALWAYS_OFF

switch:
  - platform: output
    name: Potential-free Relay
    id: potential_free_relay
    output: relay_output
    restore_mode: ALWAYS_OFF

button:
  - platform: template
    name: All LEDs Off
    on_press:
      - light.turn_off: status_led
      - light.turn_off: bus_led
      - light.turn_off: vin_led

# Relay K1 is intended for SELV/signalling loads only. Do not use this
# engineering sample for mains switching. Add DS18B20 addresses after discovery.
# Commission the MCP4725 0-10 V output only after first-article calibration.
