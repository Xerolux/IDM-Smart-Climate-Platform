substitutions:
  device_name: xerolux-b-es4-air
  friendly_name: Xerolux Ultimate Air

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: xerolux.b-es4-air
    version: "2026.08-es"

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Xerolux Air Setup"
captive_portal:

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true
  frequency: 100kHz

one_wire:
  - platform: gpio
    pin: GPIO23
    id: field_onewire

uart:
  id: rs485_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  stop_bits: 1

modbus:
  id: field_modbus
  uart_id: rs485_uart
  flow_control_pin: GPIO2

sensor:
  - platform: sht4x
    address: 0x44
    precision: High
    heater_max_duty: 0.0
    update_interval: 10s
    temperature:
      name: "Room Temperature"
      id: room_temperature
    humidity:
      name: "Room Humidity"
      id: room_humidity

  - platform: bmp3xx_i2c
    address: 0x76
    update_interval: 30s
    iir_filter: 4x
    temperature:
      name: "Pressure Sensor Temperature"
      disabled_by_default: true
    pressure:
      name: "Air Pressure"
      id: air_pressure

  - platform: scd4x
    id: scd41_sensor
    address: 0x62
    measurement_mode: periodic
    update_interval: 30s
    ambient_pressure_compensation_source: air_pressure
    automatic_self_calibration: true
    co2:
      name: "CO2"
      id: room_co2
    temperature:
      name: "CO2 Sensor Temperature"
      disabled_by_default: true
    humidity:
      name: "CO2 Sensor Humidity"
      disabled_by_default: true

  - platform: sgp4x
    update_interval: 10s
    store_baseline: true
    voc:
      name: "VOC Index"
      id: room_voc_index
    nox:
      name: "NOx Index"
      id: room_nox_index
    compensation:
      temperature_source: room_temperature
      humidity_source: room_humidity

  - platform: adc
    pin: GPIO0
    name: "0-10 V Input Raw"
    id: analog_input_raw
    attenuation: 12db
    update_interval: 2s
    filters:
      # Calibrate these endpoints on the assembled first article.
      - calibrate_linear:
          method: exact
          datapoints:
            - 0.0 -> 0.0
            - 2.326 -> 10.0
    unit_of_measurement: V
    accuracy_decimals: 2

binary_sensor:
  - platform: gpio
    name: "Dry Contact 1"
    pin:
      number: GPIO18
      inverted: true
  - platform: gpio
    name: "Dry Contact 2"
    pin:
      number: GPIO19
      inverted: true
  - platform: gpio
    name: "Service Button"
    pin:
      number: GPIO20
      inverted: true

output:
  - platform: gpio
    id: status_led_output
    pin: GPIO8
  - platform: gpio
    id: bus_led_output
    pin: GPIO22

light:
  - platform: binary
    name: "Status LED"
    output: status_led_output
    internal: true
  - platform: binary
    name: "Bus LED"
    output: bus_led_output
    internal: true

# DS18B20 probes are discovered on first boot. Add their addresses as
# dallas_temp sensor entries after reading the log, up to four probes total.
# MCP4725 / calibrated 0-10 V output is intentionally commissioned only after
# the first-article analog calibration has been measured and documented.
